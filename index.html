  <!-- Cyberpunk, Nordic Light Theme, 3D Flip Card & SVG Reactor Styles -->
  <style>
    body {
      background-color: #06040A;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 229, 255, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 230, 118, 0.04) 0%, transparent 40%),
        linear-gradient(135deg, #06040A 0%, #0E0716 50%, #150A21 100%);
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Lightweight 3D Flip Card Architecture */
    .flip-card-container {
      perspective: 800px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front,
    .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Clean Subtle Pulse for Playing (Zero distortion) */
    @keyframes subtlePulse {
      0%, 100% {
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        border-color: #00E5FF;
      }
      50% {
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
        border-color: #00E676;
      }
    }
    .pulse-playing {
      animation: subtlePulse 0.9s infinite ease-in-out !important;
    }

    /* Visual IPA Pill Glowing Indicator (Replacing robotic noise) */
    .visual-ipa-pill-active {
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.5) !important;
      border-color: #00E676 !important;

    /* BÍN X-Ray Toggle Off State */

    /* Drops Engine: Flying Flexion Suffix Animations */
    @keyframes suffixFlyOut {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
      40% {
        transform: translateY(-24px) scale(1.3) rotate(-12deg);
        opacity: 0.8;
        filter: drop-shadow(0 0 12px #FF0055);
      }
      100% {
        transform: translateY(-60px) translateX(30px) scale(0.3) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes suffixFlyIn {
      0% {
        transform: translateY(40px) scale(0.2) rotate(30deg);
        opacity: 0;
      }
      60% {
        transform: translateY(-8px) scale(1.2) rotate(-5deg);
        opacity: 1;
        filter: drop-shadow(0 0 16px #FFD600);
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

      animation: suffixFlyOut 0.55s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;

  <script type="module">
    import { Modull0App } from './components/Modull0App.js?v=5.0';

    function initApp() {
      const root = document.getElementById('app');
      if (!root) return;
      try {
        const app = new Modull0App(root);
        app.init();
        window.__PLATFORM_APP__ = app;
      } catch (err) {
        console.error('Failed to initialize Modull0App:', err);
        root.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center text-rose-400 font-mono text-xs gap-3 p-4 text-center">
            <div class="text-base font-bold">⚠️ Помилка ініціалізації платформи</div>

            <button onclick="location.reload()" class="px-4 py-2 bg-cyan-500/20 text-cyan-300 border border-cyan-500 rounded-lg font-bold">Перезавантажити</button>
          </div>
        `;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
